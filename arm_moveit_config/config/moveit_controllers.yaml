# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    joints:
      - base_shoulder_joint
      - shoulder_arm_joint
      - arm_elbow_joint
      - elbow_forearm_joint
      - forearm_wrist_joint
      - wrist_hand_joint
    action_ns: follow_joint_trajectory
    default: true

  gripper_controller:
    type: FollowJointTrajectory
    joints:
      - gripper_left_finger_joint
      - gripper_right_finger_joint
    action_ns: follow_joint_trajectory
    default: true

# Force-controlled fingers stop on the box short of their target, so the next gripper move
# starts up to 1 cm from where MoveIt planned it. Allow that for the fingers only.
# Gazebo with the depth camera can run slower than real time, while MoveIt times
# executions on the wall clock: give short moves (like closing the gripper) room to finish.
trajectory_execution:
  allowed_execution_duration_scaling: 3.0
  allowed_goal_duration_margin: 2.0
  allowed_start_tolerance_joints:
    gripper_left_finger_joint: 0.02
    gripper_right_finger_joint: 0.02
